          { h: '3. Serviços de terceiros', p: 'O App usa os seguintes serviços de terceiros, cada um regido por sua própria política de privacidade:', ul: ['<strong>Firebase (Google)</strong>: autenticação, notificações push', '<strong>RevenueCat</strong>: gerenciamento de assinaturas e cobrança', '<strong>Anthropic</strong>: processamento de texto por IA', '<strong>Supabase</strong>: armazenamento de banco de dados'], p2: 'Não vendemos nem compartilhamos suas informações pessoais com terceiros, exceto quando exigido por lei.' },
          { h: '4. Retenção e exclusão de dados', p: 'Seus dados são retidos enquanto sua conta estiver ativa. Ao excluir sua conta, todos os dados pessoais serão removidos em 30 dias. Você pode excluir sua conta a qualquer momento na tela de Configurações do app.' },
          { h: '5. Segurança', p: 'Implementamos medidas de segurança padrão do setor para proteger seus dados. No entanto, nenhum método de transmissão pela Internet é 100% seguro.' },
          { h: '6. Privacidade de crianças', p: 'O App não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de crianças menores de 13 anos.' },
          { h: '7. Alterações nesta política', p: 'Podemos atualizar esta Política de Privacidade periodicamente. Notificaremos você sobre alterações significativas por meio do app ou desta página.' },
          { h: '8. Fale conosco', p: 'Se tiver dúvidas sobre esta Política de Privacidade, entre em contato pelo e-mail <a href="mailto:i2kantak@gmail.com">i2kantak@gmail.com</a>.' },
        ],
      },
    };

    function renderContent(lang) {
      const d = t[lang];
      document.getElementById('title').innerText = d.title;
      document.getElementById('updated').innerText = d.updated;
      document.documentElement.lang = lang;

      let html = '';
      d.sections.forEach(s => {
        if (s.h) html += `<h2>${s.h}</h2>`;
        if (s.p) html += `<p>${s.p}</p>`;
        if (s.ul) html += '<ul>' + s.ul.map(i => `<li>${i}</li>`).join('') + '</ul>';
        if (s.p2) html += `<p>${s.p2}</p>`;
      });
      document.getElementById('content').innerHTML = html;
    }

    function setLang(lang) {
      document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');
      renderContent(lang);
    }

    const browserLang = navigator.language.slice(0, 2);
    setLang(['ja','en','fr','es','zh','ko','de','pt'].includes(browserLang) ? browserLang : 'en');
  </script>
</body>
</html>
