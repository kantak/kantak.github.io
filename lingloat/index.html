<!DOCTYPE html>
<html lang="ja" data-version="2026-06-15">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingloat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .lang-switch {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lang-switch button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      cursor: pointer;
      color: #888;
    }
    .lang-switch button.active {
      background: #6C63FF;
      border-color: #6C63FF;
      color: #fff;
      font-weight: 600;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6C63FF, #48A9FE);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .tagline { color: #666; font-size: 15px; margin-bottom: 24px; line-height: 1.6; white-space: pre-line; }
    .badges { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .badge {
      background: #f3f1ff;
      color: #6C63FF;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .links {
      display: flex;
      gap: 16px;
      border-top: 1px solid #eee;
      padding-top: 24px;
    }
    .links a { font-size: 13px; color: #6C63FF; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="lang-switch">
    <button onclick="setLang('ja')" id="btn-ja">日本語</button>
    <button onclick="setLang('en')" id="btn-en">English</button>
    <button onclick="setLang('fr')" id="btn-fr">Français</button>
    <button onclick="setLang('es')" id="btn-es">Español</button>
    <button onclick="setLang('zh')" id="btn-zh">中文</button>
    <button onclick="setLang('ko')" id="btn-ko">한국어</button>
    <button onclick="setLang('de')" id="btn-de">Deutsch</button>
    <button onclick="setLang('pt')" id="btn-pt">Português</button>
  </div>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Lingloat</h1>
    <p class="tagline" id="tagline"></p>
    <div class="badges" id="badges"></div>
    <div class="links">
      <a href="support.html" id="link-support"></a>
      <a href="privacy.html" id="link-privacy"></a>
      <a href="terms.html" id="link-terms"></a>
    </div>
  </div>

  <script>
    const t = {
      ja: {
        tagline: '自分の言葉で学ぶ AI 語学学習アプリ。\n日常の表現を入力するだけで、翻訳・添削・クイズが自動生成されます。',
        badges: ['iOS', 'AI翻訳・添削', 'フレーズ管理', 'クイズ'],
        support: 'サポート',
        privacy: 'プライバシーポリシー',
        terms: '利用規約',
      },
      en: {
        tagline: 'AI-powered language learning app.\nInput your daily expressions and get translations, corrections, and quizzes automatically.',
        badges: ['iOS', 'AI Translation', 'Phrase Manager', 'Quizzes'],
        support: 'Support',
        privacy: 'Privacy Policy',
        terms: 'Terms of Use',
      },
      fr: {
        tagline: 'Application d\'apprentissage des langues par IA.\nSaisissez vos expressions quotidiennes et obtenez des traductions, corrections et quiz automatiquement.',
        badges: ['iOS', 'Traduction IA', 'Gestionnaire de phrases', 'Quiz'],
        support: 'Assistance',
        privacy: 'Politique de confidentialité',
        terms: 'Conditions d\'utilisation',
      },
      es: {
        tagline: 'App de aprendizaje de idiomas con IA.\nIngresa tus expresiones del día y obtén traducciones, correcciones y quizzes automáticamente.',
        badges: ['iOS', 'Traducción IA', 'Gestor de frases', 'Quiz'],
        support: 'Soporte',
        privacy: 'Política de privacidad',
        terms: 'Términos de uso',
      },
      zh: {
        tagline: 'AI 驱动的语言学习应用。\n输入您的日常表达，自动获得翻译、纠错和测验。',
        badges: ['iOS', 'AI翻译·纠错', '短语管理', '测验'],
        support: '支持',
        privacy: '隐私政策',
        terms: '使用条款',
      },
      ko: {
        tagline: 'AI 기반 언어 학습 앱.\n일상 표현을 입력하면 번역, 교정, 퀴즈가 자동으로 생성됩니다.',
        badges: ['iOS', 'AI 번역·교정', '표현 관리', '퀴즈'],
        support: '지원',
        privacy: '개인정보 처리방침',
        terms: '이용약관',
      },
      de: {
        tagline: 'KI-gestützte Sprachlern-App.\nGib deine täglichen Ausdrücke ein und erhalte automatisch Übersetzungen, Korrekturen und Quizze.',
        badges: ['iOS', 'KI-Übersetzung', 'Ausdrucks-Manager', 'Quiz'],
        support: 'Support',
        privacy: 'Datenschutzerklärung',
        terms: 'Nutzungsbedingungen',
      },
      pt: {
        tagline: 'App de aprendizado de idiomas com IA.\nDigite suas expressões do dia e obtenha traduções, correções e quizzes automaticamente.',
        badges: ['iOS', 'Tradução IA', 'Gerenciador de expressões', 'Quiz'],
        support: 'Suporte',
        privacy: 'Política de Privacidade',
        terms: 'Termos de Uso',
      },
    };

    function setLang(lang) {
      document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');
      document.documentElement.lang = lang;

      const d = t[lang];
      document.getElementById('tagline').innerText = d.tagline;
      document.getElementById('badges').innerHTML = d.badges.map(b => `<span class="badge">${b}</span>`).join('');
      document.getElementById('link-support').innerText = d.support;
      document.getElementById('link-privacy').innerText = d.privacy;
      document.getElementById('link-terms').innerText = d.terms;
    }

    const browserLang = navigator.language.slice(0, 2);
    setLang(['ja','en','fr','es','zh','ko','de','pt'].includes(browserLang) ? browserLang : 'en');
  </script>
</body>
</html>
